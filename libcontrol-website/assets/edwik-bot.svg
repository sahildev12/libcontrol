<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-labelledby="edwikTitle">
  <title id="edwikTitle">Edwik  LibControl AI assistant</title>
  <defs>
    <linearGradient id="edwikBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eef7"/>
    </linearGradient>
    <linearGradient id="edwikBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="edwikShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#edwikShadow)">
    <!-- legs -->
    <ellipse cx="78" cy="218" rx="16" ry="9" fill="#2563eb"/>
    <ellipse cx="122" cy="218" rx="16" ry="9" fill="#2563eb"/>
    <rect x="70" y="188" width="20" height="28" rx="10" fill="url(#edwikBlue)"/>
    <rect x="110" y="188" width="20" height="28" rx="10" fill="url(#edwikBlue)"/>
    <!-- body -->
    <rect x="52" y="118" width="96" height="78" rx="28" fill="url(#edwikBody)" stroke="#e2e8f0" stroke-width="2"/>
    <!-- LC chest mark -->
    <rect x="78" y="142" width="44" height="36" rx="10" fill="#0f172a"/>
    <text x="100" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="18" fill="#ffcc00">LC</text>
    <!-- arms -->
    <ellipse cx="42" cy="152" rx="14" ry="18" fill="url(#edwikBlue)"/>
    <ellipse cx="158" cy="148" rx="14" ry="18" fill="url(#edwikBlue)"/>
    <circle cx="36" cy="168" r="11" fill="#60a5fa"/>
    <circle cx="164" cy="164" r="11" fill="#60a5fa"/>
    <!-- head -->
    <circle cx="100" cy="72" r="52" fill="url(#edwikBody)" stroke="#e2e8f0" stroke-width="2"/>
    <!-- ear pods -->
    <rect x="38" y="58" width="18" height="32" rx="9" fill="url(#edwikBlue)"/>
    <rect x="144" y="58" width="18" height="32" rx="9" fill="url(#edwikBlue)"/>
    <!-- antenna -->
    <rect x="96" y="18" width="8" height="14" rx="4" fill="#2563eb"/>
    <circle cx="100" cy="14" r="7" fill="#60a5fa"/>
    <!-- face screen -->
    <rect x="62" y="48" width="76" height="48" rx="16" fill="#0f172a"/>
    <!-- happy eyes -->
    <path d="M82 72 Q88 64 94 72" fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M106 72 Q112 64 118 72" fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="82" r="2.5" fill="#00e5ff" opacity="0.6"/>
  </g>
</svg>
